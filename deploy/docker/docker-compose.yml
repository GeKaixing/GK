version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: gkx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gekaixing
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: gkx-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
